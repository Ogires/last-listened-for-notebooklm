<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="extName"></title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 14px/1.5 system-ui, sans-serif;
      margin: 0;
      padding: 16px 20px 20px;
      min-width: 360px;
      max-width: 560px;
    }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
    p { margin: 0 0 12px; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    #count { font-weight: 600; }
    button { font: inherit; padding: 6px 14px; border-radius: 16px; cursor: pointer; }
    button:disabled { cursor: default; opacity: .5; }
    #status { color: #146c2e; }
    .note { opacity: .75; font-size: 13px; }
    @media (prefers-color-scheme: dark) { #status { color: #6dd58c; } }
  </style>
</head>
<body>
  <h1 data-i18n="extName"></h1>
  <div class="row">
    <span id="count"></span>
    <button id="clear" type="button" data-i18n="optionsClear"></button>
    <span id="status" role="status"></span>
  </div>
  <p class="note" data-i18n="optionsPrivacy"></p>
  <p class="note" data-i18n="optionsHealthHelp"></p>
  <script src="storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
