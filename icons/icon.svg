<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Fuente de los iconos: anillo de reloj + "play" = "cuándo lo reprodujiste".
       Los PNG se generan con `npm run icons` (scripts/build-icons.mjs). -->
  <rect width="128" height="128" rx="30" fill="#3949ab"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#fff" stroke-width="11"/>
  <!-- marcas de las 12 y las 3: lo distinguen de un botón de play genérico -->
  <rect x="59" y="14" width="10" height="16" rx="3" fill="#3949ab"/>
  <rect x="98" y="59" width="16" height="10" rx="3" fill="#3949ab"/>
  <path d="M55 45 L85 64 L55 83 Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
</svg>
